:root {
  --background: #f7f8fa;
  --ink: #20242b;
  --secondary: #69717d;
  --line: #dce0e6;
  --accent: #3d5cca;
  --radius: 12px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection {
  background: #cad5f8;
  color: #20242b;
}
[hidden] {
  display: none !important;
}
button,
input {
  font: inherit;
}
button,
a,
input {
  outline-offset: 5px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  opacity: 0.4;
  cursor: default;
}
a {
  color: inherit;
  text-underline-offset: 4px;
}
svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
button svg,
a svg {
  pointer-events: none;
}
.shell {
  max-width: 840px;
  padding: 0 44px;
  margin: auto;
}
/* Keep the player's preferred sizing, yielding only when the viewport is shorter. */
.shell:has(#player-view:not([hidden])) {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}
.shell:has(#player-view:not([hidden])) > main,
#content:has(> #player-view:not([hidden])),
#player-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.shell:has(#player-view:not([hidden])) > .header,
#content > .notice,
#player-view > .intro,
#player-view > .download-row,
#player-view .waveform,
#player-view .transport {
  flex-shrink: 0;
}
#player-view .player {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 0 1 auto;
}
#player-view .stage {
  min-height: 0;
  flex-shrink: 1;
}
.header {
  height: 106px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: flex;
  gap: 3px;
  align-items: center;
  height: 44px;
  padding: 11px;
  margin-left: -11px;
  text-decoration: none;
}
.player-link {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-right: -11px;
}
.player-link svg {
  width: 26px;
  height: 26px;
}
.brand span {
  display: block;
  width: 2px;
  background: var(--ink);
  border-radius: 2px;
}
.brand span:nth-child(1),
.brand span:nth-child(5) {
  height: 8px;
}
.brand span:nth-child(2),
.brand span:nth-child(4) {
  height: 16px;
}
.brand span:nth-child(3) {
  height: 22px;
}
.intro {
  padding-top: 22px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
}
h1 {
  font-size: clamp(38px, 5.5vw, 58px);
  font-weight: 520;
  letter-spacing: -0.04em;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.player {
  margin-top: 6px;
}
.credits {
  margin: 14px 0 0;
  color: var(--secondary);
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.credits:empty {
  display: none;
}
.stage {
  position: relative;
  height: 316px;
  display: grid;
  place-items: center;
  isolation: isolate;
}
.stage > canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.play-orbit {
  position: relative;
}
.play {
  width: 68px;
  height: 68px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: white;
  transition:
    transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
    background 0.25s ease-out,
    box-shadow 0.35s ease-out;
}
@media (hover: hover) {
  .play:hover {
    background: var(--accent);
    transform: scale(1.07);
    box-shadow: 0 6px 20px #263f7826;
  }
}
.play:active {
  transform: scale(0.96);
}
.play svg {
  width: 24px;
  height: 24px;
}
.play .triangle {
  fill: currentColor;
  stroke: none;
  transform: translateX(2px);
}
.is-playing .play {
  background: var(--accent);
}
.waveform {
  height: 66px;
  position: relative;
  isolation: isolate;
  touch-action: none;
  margin: 0 0 12px;
}
.waveform canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.waveform input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: crosshair;
  z-index: 2;
  touch-action: none;
}
.waveform:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 6px;
  border-radius: 4px;
}
.cursor {
  position: absolute;
  left: 0;
  top: -4px;
  bottom: -4px;
  width: 1px;
  background: var(--accent);
  pointer-events: none;
}
.cursor:before {
  content: "";
  position: absolute;
  top: -3px;
  left: -2px;
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
}
.preview-needle {
  position: absolute;
  top: -4px;
  bottom: -4px;
  left: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease-out;
}
.preview-needle span {
  position: absolute;
  top: -25px;
  left: 0;
  transform: translateX(-50%);
  padding: 4px 7px;
  background: var(--ink);
  color: #fff;
  border-radius: 5px;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
@media (hover: hover) {
  .waveform:hover .preview-needle {
    opacity: 0.8;
  }
}
.waveform:active .preview-needle {
  opacity: 0;
}
.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  min-height: 44px;
}
.time {
  font-size: 12px;
  color: var(--secondary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.transport-controls,
.track-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.track-controls {
  gap: 4px;
  margin-right: -10px;
}
.track-controls .icon-button {
  width: 44px;
  height: 44px;
}
@media (hover: hover) {
  .track-controls .icon-button:hover:disabled {
    background: none;
  }
}
.current {
  color: var(--ink);
  font-weight: 550;
}
.separator {
  padding: 0 6px;
  color: #929baa;
}
.volume {
  display: flex;
  align-items: center;
  gap: 5px;
}
.icon-button {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  background: none;
  border: 0;
  border-radius: 50%;
}
@media (hover: hover) {
  .icon-button:hover {
    background: #e9ecf2;
  }
}
.icon-button svg {
  width: 17px;
  height: 17px;
}
.volume input {
  width: 134px;
  height: 3px;
  accent-color: var(--ink);
  cursor: pointer;
}
.download-row {
  display: flex;
  gap: 24px;
  align-items: center;
  justify-content: space-between;
  margin-top: 30px;
  padding: 25px 0;
  border-top: 1px solid var(--line);
}
.file-description {
  min-width: 0;
}
.quality {
  display: block;
  font-size: 12px;
  color: var(--secondary);
  line-height: 1.8;
}
.file-meta {
  font-size: 12px;
  line-height: 1.8;
  color: var(--secondary);
}
.download {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
  text-decoration: none;
  background: var(--ink);
  color: #fff;
  border-radius: 8px;
  padding: 13px 19px;
  font-size: 13px;
  font-weight: 550;
  transition:
    background 0.2s ease-out,
    transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@media (hover: hover) {
  .download:hover {
    background: var(--accent);
  }
}
.download:active {
  transform: translateY(1px);
}
.download svg {
  width: 16px;
  height: 16px;
}
.notice {
  font-size: 13px;
  line-height: 1.6;
  padding: 15px 0;
  color: var(--ink);
  margin: 12px 0 0;
}
.empty {
  padding: 90px 0;
}
.empty h1 {
  font-size: 32px;
}
.empty p {
  color: var(--secondary);
  font-size: 14px;
  line-height: 1.7;
  max-width: 50ch;
}
.track-description > span,
.track-credits {
  display: block;
}
.track-credits {
  margin-top: 2px;
  line-height: 1.5;
}
.library-view {
  display: flex;
  flex-direction: column;
  min-height: calc(100svh - 106px);
  padding-bottom: 0;
}
.library-tabs {
  display: flex;
  gap: 28px;
  margin-top: 24px;
}
.library-tabs button {
  position: relative;
  border: 0;
  padding: 10px 0 12px;
  min-height: 44px;
  color: var(--secondary);
  background: none;
  font-size: 16px;
  font-weight: 550;
}
.library-tabs button[aria-selected="true"] {
  color: var(--accent);
}
.library-tabs button[aria-selected="true"]::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  border-radius: 1px;
  background: currentColor;
}
.library-search {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  margin-top: 16px;
  padding: 0 14px;
  background: #eceff4;
  border-radius: 9px;
  color: var(--secondary);
}
.library-search:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.library-search input {
  border: 0;
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0;
  background: none;
  color: var(--ink);
  caret-color: var(--accent);
  font-size: 16px;
}
.library-search input:focus-visible {
  outline: none;
}
.library-search input::placeholder {
  color: var(--secondary);
  opacity: 1;
}
.library-selection-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 60px;
  padding-top: 8px;
}
#library-selection-count {
  font-size: 15px;
  font-weight: 550;
}
.library-selection-actions {
  display: flex;
  gap: 16px;
}
.text-button {
  min-height: 44px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 14px;
}
@media (hover: hover) {
  .text-button:hover {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
}
.library-tracks {
  margin: 0;
}
.library-track {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.library-track-link {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
  min-width: 0;
  min-height: 44px;
  text-decoration: none;
  cursor: pointer;
}
@media (hover: hover) {
  .library-track-link:hover .library-track-heading {
    color: var(--accent);
  }
}
.library-track-link,
.library-save,
.library-play-next,
.library-selection-control input {
  scroll-margin-block: 16px 180px;
}
.library-track .track-description {
  min-width: 0;
  flex: 1;
  overflow-wrap: anywhere;
}
.library-track .library-track-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 16px;
  font-weight: 550;
}
.library-current-indicator {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--accent);
}
.library-current-indicator svg {
  width: 16px;
  height: 16px;
  stroke-width: 2;
}
.library-track small {
  font-size: 12px;
  color: var(--secondary);
}
.library-track .track-detail {
  flex: 0 0 auto;
  text-align: right;
  font-size: 13px;
  color: var(--secondary);
  font-variant-numeric: tabular-nums;
}
.library-save {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  margin-right: -10px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--secondary);
}
@media (hover: hover) {
  .library-save:hover {
    background: #e9ecf2;
  }
}
.library-save[aria-pressed="true"] {
  color: var(--accent);
}
.library-save[aria-pressed="true"] svg {
  fill: currentColor;
}
.library-save svg {
  width: 18px;
  height: 18px;
}
.library-track-actions {
  display: flex;
  flex-shrink: 0;
  margin-right: -10px;
}
.library-track-actions .library-save {
  margin-right: 0;
}
.library-play-next {
  width: 44px;
  height: 44px;
  color: var(--secondary);
}
.library-selection-control {
  position: relative;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  margin-left: -10px;
}
.library-selection-control input {
  position: absolute;
  inset: 0;
  margin: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}
.library-selection-control > span {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 1px solid #7a8596;
  border-radius: 50%;
  color: transparent;
  pointer-events: none;
}
.library-selection-control input:checked + span {
  color: #fff;
  border-color: var(--accent);
  background: var(--accent);
}
.library-selection-control input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}
.library-selection-control svg {
  width: 17px;
  height: 17px;
  stroke-width: 2;
}
.library-download {
  margin-top: 18px;
}
.library-download .download {
  min-height: 46px;
  width: 100%;
}
.library-download p {
  margin: 10px 0 0;
  text-align: center;
  color: var(--secondary);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.library-empty,
.library-storage-notice {
  margin: 0;
  padding: 20px 0;
  color: var(--secondary);
  font-size: 14px;
  line-height: 1.6;
}
.mini-player {
  position: sticky;
  bottom: 0;
  z-index: 3;
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 16px 0 max(20px, env(safe-area-inset-bottom));
  background: var(--background);
}
#library-results,
.library-download {
  margin-bottom: 28px;
}
.mini-transport {
  display: flex;
  gap: 20px;
  align-items: center;
  justify-content: space-between;
}
.mini-return {
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  min-width: 0;
  flex: 1;
}
.mini-description {
  display: grid;
  gap: 6px;
  overflow-wrap: anywhere;
  min-width: 0;
}
#mini-title {
  font-size: 16px;
  font-weight: 550;
}
#mini-credits {
  color: var(--secondary);
  font-size: 12px;
  line-height: 1.5;
}
.mini-player .play {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
}
.mini-player .play svg {
  width: 20px;
  height: 20px;
}
.mini-seek {
  display: block;
  width: 100%;
  height: 44px;
  margin: 2px 0 -8px;
  touch-action: none;
  background: transparent;
  appearance: none;
  cursor: pointer;
  --progress: 0%;
}
.mini-seek::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--progress), var(--line) var(--progress));
}
.mini-seek::-webkit-slider-thumb {
  appearance: none;
  width: 9px;
  height: 9px;
  margin-top: -3px;
  border-radius: 50%;
  background: var(--accent);
}
.mini-seek::-moz-range-track {
  height: 3px;
  border-radius: 2px;
  background: var(--line);
}
.mini-seek::-moz-range-progress {
  height: 3px;
  background: var(--accent);
}
.mini-seek::-moz-range-thumb {
  width: 9px;
  height: 9px;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
}
.mini-times {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.queue-button {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 44px;
  padding: 0 10px;
  border: 0;
  background: none;
  color: var(--ink);
  font-size: 12px;
}
.queue-button svg {
  width: 17px;
  height: 17px;
}
#queue-count {
  color: var(--secondary);
}
.screen-reader-only {
  position: absolute;
  inset: 0 auto auto 0;
  margin: 0;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.queue-dialog {
  position: fixed;
  inset: auto 0 0;
  margin: 0 auto max(16px, env(safe-area-inset-bottom));
  width: min(480px, calc(100% - 24px));
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
  padding: 12px 22px 20px;
  border: 0;
  border-radius: 16px;
  background: var(--background);
  color: var(--ink);
  box-shadow: 0 12px 36px #20242b29;
}
.queue-dialog::backdrop {
  background: #20242b38;
}
.queue-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 48px;
}
.queue-heading h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 550;
  letter-spacing: -.02em;
}
.queue-dialog .icon-button {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  margin-right: -10px;
}
.queue-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.queue-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.queue-list li > span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.queue-track-title {
  display: block;
  font-size: 15px;
  font-weight: 550;
  line-height: 1.5;
}
.queue-track-credits,
.queue-empty {
  display: block;
  color: var(--secondary);
  font-size: 12px;
  line-height: 1.6;
}
.queue-track-credits {
  margin-top: 4px;
}
.queue-empty {
  margin: 12px 0 18px;
}
.queue-library {
  display: grid;
  gap: 5px;
  margin-top: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 13px;
}
.queue-library > span:first-child {
  color: var(--secondary);
  font-size: 12px;
}
@media (max-width: 600px) {
  .volume input {
    width: 48px;
  }
  .library-view {
    min-height: calc(100svh - 80px);
  }
  .shell {
    padding: 0 27px;
  }
  .header {
    height: 80px;
  }
  .intro {
    padding-top: 16px;
  }
  h1 {
    font-size: 44px;
  }
  .stage {
    height: 290px;
  }
  .waveform {
    height: 53px;
  }
  .play {
    width: 62px;
    height: 62px;
  }
  .download-row {
    margin-top: 24px;
    padding: 22px 0;
    gap: 12px;
  }
  .download {
    font-size: 12px;
    padding: 13px 16px;
  }
  .quality,
  .file-meta {
    font-size: 11px;
  }
}
@media (max-width: 360px) {
  .shell {
    padding: 0 20px;
  }
  .download-row {
    align-items: stretch;
    flex-direction: column;
    gap: 15px;
  }
  .stage {
    height: 250px;
  }
  .quality,
  .file-meta {
    display: inline;
  }
  .quality:after {
    content: " · ";
  }
}
/* Short landscape needs real content scrolling to retain the approved layout. */
@media (orientation: landscape) and (max-height: 600px) {
  .shell:has(#player-view:not([hidden])) {
    height: auto;
    min-height: 100dvh;
  }
}
@media (hover: none) {
  .preview-needle {
    display: none;
  }
}
/* Touch screens keep :hover after a tap, so taps get a press state that ends with the touch. */
@media (hover: none) {
  .icon-button:active:not(:disabled),
  .library-save:active {
    background: #e9ecf2;
  }
  .download:active {
    background: var(--accent);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* Desktop player: the whole window is the stage. The animation fills the space
   above the transport, the title sits top left, the file and download top right,
   and the waveform and controls run along the bottom. Narrow windows fall back to the
   stacked layout. */
@media (min-width: 901px) {
  .shell:has(#player-view:not([hidden])) {
    max-width: none;
    padding: 0;
  }
  .shell:has(#player-view:not([hidden])) > .header {
    position: fixed;
    top: 0;
    left: var(--gutter);
    right: var(--gutter);
    height: 96px;
    z-index: 3;
    pointer-events: none;
  }
  .shell:has(#player-view:not([hidden])) > .header > * {
    pointer-events: auto;
  }
  #player-view > .intro {
    position: fixed;
    top: 96px;
    left: var(--gutter);
    max-width: min(42vw, 620px);
    padding: 0;
    z-index: 2;
    pointer-events: none;
  }
  #player-view > .intro h1 {
    font-size: clamp(44px, 4.6vw, 72px);
  }
  #player-view .player {
    margin: 0;
  }
  #player-view .stage {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 150px;
    height: auto;
    z-index: 0;
  }
  #player-view .waveform {
    position: fixed;
    left: var(--gutter);
    right: var(--gutter);
    bottom: 76px;
    height: 52px;
    margin: 0;
    z-index: 2;
  }
  #player-view .transport {
    position: fixed;
    left: var(--gutter);
    right: var(--gutter);
    bottom: 20px;
    z-index: 2;
  }
  #player-view > .download-row {
    position: fixed;
    top: 104px;
    right: var(--gutter);
    margin: 0;
    padding: 0;
    border: 0;
    gap: 20px;
    z-index: 2;
  }
  #player-view > .download-row .file-description {
    text-align: right;
  }
}
@media (min-width: 901px) {
  :root {
    --gutter: clamp(32px, 4vw, 64px);
  }
}

/* ---- Visualizers ----------------------------------------------------------------
   Each visualizer draws into its own canvas in the stage and sets a theme through
   html[data-visual]. While audio plays the play button leaves; the controls, the
   file row and the brand step aside until the pointer moves or focus enters them. */
.stage > .visual-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
  z-index: -1;
}
.stage > .visual-canvas[hidden] {
  display: none;
}
:root {
  --waveform-played: #315bca;
  --waveform-rest: #8290a3;
  --waveform-empty: #aeb6c2;
  --vz-background: var(--background);
  --vz-ink: var(--ink);
  --vz-secondary: var(--secondary);
  --vz-accent: var(--accent);
  --vz-button: var(--ink);
  --vz-button-ink: #fff;
  --vz-scrim: none;
  --vz-title-font: inherit;
  --vz-title-weight: 520;
  --vz-title-spacing: -0.04em;
  --vz-title-transform: none;
  --vz-title-scale: 1;
  --vz-credits-font: inherit;
  --vz-credits-size: 13px;
  --vz-credits-spacing: 0;
  --vz-credits-transform: none;
}
body:has(#player-view:not([hidden])) {
  background: var(--vz-background);
  color: var(--vz-ink);
  --ink: var(--vz-ink);
  --secondary: var(--vz-secondary);
  --accent: var(--vz-accent);
  --line: color-mix(in srgb, var(--vz-ink) 18%, transparent);
}
#player-view .intro h1 {
  font-family: var(--vz-title-font);
  font-weight: var(--vz-title-weight);
  letter-spacing: var(--vz-title-spacing);
  text-transform: var(--vz-title-transform);
}
#player-view .credits {
  font-family: var(--vz-credits-font);
  font-size: var(--vz-credits-size);
  letter-spacing: var(--vz-credits-spacing);
  text-transform: var(--vz-credits-transform);
}
#player-view .play {
  background: var(--vz-button);
  color: var(--vz-button-ink);
}
#player-view .icon-button:hover {
  background: color-mix(in srgb, var(--vz-ink) 12%, transparent);
}
#player-view .download {
  background: var(--vz-button);
  color: var(--vz-button-ink);
}
#player-view .volume input {
  accent-color: var(--vz-ink);
}
@media (min-width: 901px) {
  .visual-playing #player-view .play-orbit {
    visibility: hidden;
  }
  #player-view .stage {
    bottom: 0;
  }
  #player-view > .intro h1 {
    font-size: calc(clamp(44px, 4.6vw, 72px) * var(--vz-title-scale));
  }
  #player-view .player::after {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 190px;
    background: var(--vz-scrim);
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.25s ease-out;
  }
  .shell:has(#player-view:not([hidden])) > .header > *,
  #player-view > .download-row,
  #player-view .waveform,
  #player-view .transport,
  #player-view .player::after {
    transition: opacity 0.25s ease-out;
  }
  .visual-playing.controls-idle .shell:has(#player-view:not([hidden])) > .header > *,
  .visual-playing.controls-idle #player-view > .download-row,
  .visual-playing.controls-idle #player-view .waveform,
  .visual-playing.controls-idle #player-view .transport,
  .visual-playing.controls-idle #player-view .player::after {
    opacity: 0;
    transition: opacity 0.5s ease-in;
  }
  .visual-playing.controls-idle #player-view .stage {
    cursor: none;
  }
}

/* Rig: black room, white type. */
html[data-visual="rig"] {
  --vz-background: #000;
  --vz-ink: #f2f0ec;
  --vz-secondary: #d9d6d0;
  --vz-accent: #f2f0ec;
  --vz-button: #f2f0ec;
  --vz-button-ink: #000;
  --waveform-played: #f2f0ec;
  --waveform-rest: #4a4845;
  --waveform-empty: #4a4845;
  --vz-scrim: linear-gradient(to top, rgb(0 0 0 / 0.85), rgb(0 0 0 / 0));
  --vz-title-font: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --vz-title-weight: 650;
  --vz-title-spacing: -0.035em;
  --vz-credits-font: "IBM Plex Mono", ui-monospace, monospace;
  --vz-credits-size: 18px;
  --vz-credits-spacing: 0.08em;
  --vz-credits-transform: uppercase;
}
html[data-visual="rig"] #player-view > .intro {
  text-shadow: 0 0 18px rgb(0 0 0 / 0.75), 0 0 3px rgb(0 0 0 / 0.6);
}

/* Type: one saturated field per song, set by the visualizer; the page follows its ink. */
html[data-visual="type"] {
  --vz-background: var(--type-field, #2530f2);
  --vz-ink: var(--type-ink, #f3efe4);
  --vz-secondary: var(--type-ink, #f3efe4);
  --vz-accent: var(--type-ink, #f3efe4);
  --vz-button: var(--type-ink, #f3efe4);
  --vz-button-ink: var(--type-field, #2530f2);
  --waveform-played: var(--type-ink, #f3efe4);
  --waveform-rest: color-mix(in srgb, var(--type-ink, #f3efe4) 35%, transparent);
  --vz-title-font: "Archivo", "Arial Narrow", sans-serif;
  --vz-title-weight: 800;
  --vz-title-spacing: -0.02em;
  --vz-credits-font: "IBM Plex Mono", ui-monospace, monospace;
  --vz-credits-size: 18px;
  --vz-credits-spacing: 0.06em;
  --vz-credits-transform: uppercase;
}

/* Pocket: cut paper; the field changes by scene and the page follows it. */
html[data-visual="pocket"] {
  --vz-background: var(--pocket-field, #eab12c);
  --vz-ink: var(--pocket-ink, #151413);
  --vz-secondary: var(--pocket-ink, #151413);
  --vz-accent: var(--pocket-ink, #151413);
  --vz-button: var(--pocket-ink, #151413);
  --vz-button-ink: var(--pocket-field, #eab12c);
  --waveform-played: var(--pocket-ink, #151413);
  --waveform-rest: color-mix(in srgb, var(--pocket-ink, #151413) 35%, transparent);
  --vz-title-font: "Jost", "Futura", sans-serif;
  --vz-title-weight: 600;
  --vz-title-spacing: -0.01em;
  --vz-credits-font: "Jost", "Futura", sans-serif;
  --vz-credits-size: 20px;
  --vz-credits-spacing: 0.02em;
}

/* Plate: an engraved plate; ivory ground (vermilion, then ink, after the song's turn). */
html[data-visual="plate"] {
  --vz-background: var(--plate-ground, #efe9dc);
  --vz-ink: var(--plate-ink, #171513);
  --vz-secondary: var(--plate-ink, #171513);
  --vz-accent: var(--plate-ink, #171513);
  --vz-button: var(--plate-ink, #171513);
  --vz-button-ink: var(--plate-ground, #efe9dc);
  --waveform-played: var(--plate-ink, #171513);
  --waveform-rest: color-mix(in srgb, var(--plate-ink, #171513) 30%, transparent);
  --vz-title-font: "Instrument Serif", "Times New Roman", serif;
  --vz-title-weight: 400;
  --vz-title-spacing: -0.01em;
  --vz-title-scale: 1.25;
  --vz-credits-font: "Instrument Serif", "Times New Roman", serif;
  --vz-credits-size: 22px;
  --vz-credits-spacing: 0;
}
html[data-visual="plate"] #player-view > .intro h1 {
  font-style: italic;
}
html[data-visual="type"] {
  --vz-scrim: linear-gradient(to top, var(--type-field, #2530f2) 55%, transparent);
}
html[data-visual="type"] #player-view .play,
html[data-visual="pocket"] #player-view .play,

    <script>async function requestTracks() {
  const response = await fetch("/api/tracks", { cache: "no-store" });
  if (!response.ok) throw Error();
  return response.json();
}

async function requestPlaybackCopy(address, signal) {
  const response = await fetch(address, { signal, cache: "no-store" });
  if (!response.ok) throw Error();
  return response.json();
}

async function requestBandAnalysis(address, signal) {
  const response = await fetch(address, { signal });
  if (!response.ok) throw Error("Analysis unavailable");
  const analysis = await response.json();
  if (
    analysis.version !== 1 ||
    analysis.band_count !== 40 ||
    !Number.isInteger(analysis.frame_count) ||
    analysis.frame_count < 1 ||
    !(analysis.frame_rate > 0)
  )
    throw Error("Invalid analysis");
  const samples = Uint8Array.from(atob(analysis.data), (character) =>
    character.charCodeAt(0),
  );
  if (samples.length !== analysis.frame_count * 40)
    throw Error("Incomplete analysis");
  const envelopes = {};
  for (const name of ["energy", "bass", "onset"]) {
    const values = Uint8Array.from(atob(analysis[name]), (character) =>
      character.charCodeAt(0),
    );
    if (values.length !== analysis.frame_count)
      throw Error("Incomplete analysis envelope");
    envelopes[name] = values;
  }
  return { ...analysis, samples, envelopes };
}

const elements = Object.fromEntries(
  [...document.querySelectorAll("[id]")].map((element) => [
    element.id,
    element,
  ]),
);

const audio = elements.audio;
const isIOS =
  /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const prefersPlaybackCopy = isIOS || /Android|Mobile/.test(navigator.userAgent);
let volumeLevel = 1;
let volumeMuted = false;
elements.volume.closest(".volume").hidden = isIOS;
if (navigator.audioSession) {
  try {
    navigator.audioSession.type = "playback";
  } catch (error) {}
}

const playIcon =
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="triangle" d="M7 4.5v15L20 12Z"/></svg>';

const pauseIcon =
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>';

let tracks = [],
  selected = null,
  selectionVersion = 0,
  playbackRequested = false,
  pendingSeek = null,
  fallbackLoading = false,
  usingFallback = false,
  fallbackController = null;
let seekPreview = null;

function requestedIdentifier() {
  return location.pathname.match(/^\/track\/([a-f0-9]{24})$/)?.[1] || null;
}

function sourceIsCurrent() {
  return (
    selected && audio.currentSrc === new URL(audio.src, location.href).href
  );
}

async function playSelected(version = selectionVersion) {
  if (version !== selectionVersion || !playbackRequested) return;
  const source = audio.src;
  try {
    await audio.play();
    if (version === selectionVersion && source === audio.src) showNotice("");
  } catch (error) {
    if (
      version !== selectionVersion ||
      source !== audio.src ||
      error.name === "AbortError"
    )
      return;
    if (
      error.name === "NotSupportedError" ||
      [3, 4].includes(audio.error?.code)
    ) {
      await useStreamingCopy(version);
      return;
    }
    playbackRequested = false;
    setPlaybackBusy(false);
    setPlaybackState();
    showNotice(
      error.name === "NotAllowedError"
        ? "Tap play to continue."
        : "Playback stopped. Try play again.",
    );
  }
}

async function useStreamingCopy(version = selectionVersion) {
  if (version !== selectionVersion || !selected || fallbackLoading) return;
  if (usingFallback) {
    playbackRequested = false;
    setPlaybackBusy(false);
    setPlaybackState();
    showNotice("Audio could not play. Download the file to listen.");
    return;
  }
  fallbackLoading = true;
  usingFallback = true;
  pendingSeek = pendingSeek ?? audio.currentTime ?? 0;
  audio.pause();
  setPlaybackBusy(true);
  setPlaybackState();
  const controller = new AbortController();
  fallbackController = controller;
  try {
    const result = await requestPlaybackCopy(
      selected.streaming,
      controller.signal,
    );
    if (version !== selectionVersion) return;
    fallbackLoading = false;
    audio.src = result.url;
    audio.load();
    if (playbackRequested) await playSelected(version);
    else setPlaybackBusy(false);
  } catch (error) {
    if (version !== selectionVersion || error.name === "AbortError") return;
    fallbackLoading = false;
    usingFallback = false;
    playbackRequested = false;
    setPlaybackBusy(false);
    setPlaybackState();
    showNotice("Audio could not load. Try again or download the file.");
  }
}

elements.play.innerHTML = playIcon;

function time(value) {
  value = Math.max(0, Math.floor(value || 0));
  return value >= 3600
    ? `${Math.floor(value / 3600)}:${String(Math.floor(value / 60) % 60).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`
    : `${Math.floor(value / 60)}:${String(value % 60).padStart(2, "0")}`;
}

function size(value) {
  return value >= 1e9
    ? `${(value / 1e9).toFixed(2)} GB`
    : `${(value / 1e6).toFixed(1)} MB`;
}

function showNotice(message, kind = "playback") {
  elements.notice.textContent = message;
  elements.notice.dataset.kind = message ? kind : "";
  elements.notice.hidden = !message;
}

function setPlaybackState() {
  const playing = playbackRequested || (!audio.paused && !audio.ended);
  for (const button of [elements.play, elements["mini-play"]]) {
    button.innerHTML = playing ? pauseIcon : playIcon;
    button.setAttribute("aria-label", playing ? "Pause" : "Play");
  }
  elements["mini-player"].classList.toggle("is-playing", playing);
  updateLibraryPlaybackState();
}

function setPlaybackBusy(busy) {
  for (const button of [elements.play, elements["mini-play"]]) {
    if (busy) button.setAttribute("aria-busy", "true");
    else button.removeAttribute("aria-busy");
  }
}

function pausePlayback() {
  playbackRequested = false;
  audio.pause();
  savePlaybackSession();
  setPlaybackBusy(false);
  setPlaybackState();
  updateMediaSessionState();
}

async function resumePlayback() {
  if (!selected) return;
  playbackRequested = true;
  setPlaybackState();
  if (fallbackLoading) {
    setPlaybackBusy(true);
    return;
  }
  if (audio.error && usingFallback) {
    usingFallback = false;
    await useStreamingCopy(selectionVersion);
    return;
  }
  await playSelected(selectionVersion);
}

for (const button of [elements.play, elements["mini-play"]]) {
  button.addEventListener("click", () => {
    if (playbackRequested || !audio.paused) pausePlayback();
    else resumePlayback();
  });
}

function previewSeekFromControl(event) {
  const duration = Number.isFinite(audio.duration)
    ? audio.duration
    : selected?.duration || 0;
  if (!duration) return;
  seekPreview = {
    control: event.currentTarget,
    position: (Number(event.currentTarget.value) / 1000) * duration,
    selectionVersion,
  };
  updatePosition();
}

function commitSeekFromControl(event) {
  if (!seekPreview || seekPreview.control !== event.currentTarget) return;
  const preview = seekPreview;
  seekPreview = null;
  if (preview.selectionVersion === selectionVersion) seekPlayback(preview.position);
  else updatePosition();
}

function cancelSeekPreview() {
  if (!seekPreview) return;
  seekPreview = null;
  updatePosition();
}

for (const control of [elements.seek, elements["mini-seek"]]) {
  control.addEventListener("input", previewSeekFromControl);
  control.addEventListener("change", commitSeekFromControl);
  control.addEventListener("pointerup", commitSeekFromControl);
  control.addEventListener("pointercancel", cancelSeekPreview);
  control.addEventListener("blur", cancelSeekPreview);
}

// Touch range inputs move only when their small thumb is dragged. The mini seeker instead
// follows the finger from anywhere on its bar and commits on release, like the waveform.
const miniSeek = elements["mini-seek"];
miniSeek.addEventListener("touchstart", (event) => event.preventDefault(), { passive: false });
miniSeek.addEventListener("pointerdown", (event) => {
  if (miniSeek.disabled || event.pointerType === "mouse") return;
  miniSeek.setPointerCapture(event.pointerId);
  const follow = (pointerEvent) => {
    const bounds = miniSeek.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (pointerEvent.clientX - bounds.left) / bounds.width));
    miniSeek.value = String(Math.round(fraction * Number(miniSeek.max)));
    miniSeek.dispatchEvent(new Event("input"));
  };
  const finish = () => {
    miniSeek.removeEventListener("pointermove", follow);
    miniSeek.removeEventListener("pointerup", finish);
    miniSeek.removeEventListener("pointercancel", finish);
  };
  follow(event);
  miniSeek.addEventListener("pointermove", follow);
  miniSeek.addEventListener("pointerup", finish);
  miniSeek.addEventListener("pointercancel", finish);
});

function applyVolume() {
  audio.volume = volumeLevel;
  audio.muted = volumeMuted;
  const silent = volumeMuted || volumeLevel === 0;
  elements.mute.setAttribute("aria-label", silent ? "Unmute" : "Mute");
  elements.mute.setAttribute("aria-pressed", String(silent));
  elements.volume.value = volumeMuted ? 0 : volumeLevel;
  elements.mute.innerHTML = silent
    ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4V5Zm5 4 5 6m0-6-5 6"/></svg>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>';
}

elements.volume.addEventListener("input", () => {
  volumeLevel = Number(elements.volume.value);
  volumeMuted = false;
  applyVolume();
});

elements.mute.addEventListener("click", () => {
  if (volumeLevel === 0) {
    volumeLevel = 1;
    volumeMuted = false;
  } else volumeMuted = !volumeMuted;
  applyVolume();
});

audio.addEventListener("loadedmetadata", () => {
  if (!sourceIsCurrent()) return;
  elements.seek.disabled = !Number.isFinite(audio.duration);
  elements["mini-seek"].disabled = elements.seek.disabled;
  if (pendingSeek !== null && Number.isFinite(audio.duration)) {
    audio.currentTime = Math.min(pendingSeek, audio.duration);
    pendingSeek = null;
  }
  updatePosition();
  updateMediaSessionPosition();
});

audio.addEventListener("timeupdate", () => {
  updatePosition();
  updateMediaSessionPosition();
});
audio.addEventListener("play", () => {
  if (!sourceIsCurrent()) return;
  playbackRequested = true;
  setPlaybackState();
  document.querySelector(".player").classList.add("is-playing");
  startVisualizer();
  updateMediaSessionState();
});
audio.addEventListener("pause", () => {
  if (!fallbackLoading && !audio.error && audio.paused)
    playbackRequested = false;
  setPlaybackBusy(false);
  setPlaybackState();
  document.querySelector(".player").classList.remove("is-playing");
  stopVisualizer();
  updateMediaSessionState();
  if (!fallbackLoading && audio.paused && sourceIsCurrent()) savePlaybackSession();
});
audio.addEventListener("ended", () => {
  if (!sourceIsCurrent() || !audio.ended) return;
  playbackRequested = false;
  const shouldAdvance = queuedTracks().length > 0 || prefersPlaybackCopy;
  if (!shouldAdvance || !nextPlaybackTrack(true, false)) {
    setPlaybackState();
    updateMediaSessionState();
  }
});

audio.addEventListener("waiting", () => {
  if (!audio.paused) {
    setPlaybackBusy(true);
  }
});
audio.addEventListener("playing", () => {
  setPlaybackBusy(false);
  setPlaybackState();
});

audio.addEventListener("error", () => {
  if (!sourceIsCurrent()) return;
  if ([3, 4].includes(audio.error?.code)) {
    useStreamingCopy(selectionVersion);
    return;
  }
  playbackRequested = false;
  setPlaybackBusy(false);
  setPlaybackState();
  showNotice("Audio could not load. Reload the page to try again.");
});

// iOS Safari applies :active only when the page listens for touches.
document.addEventListener("touchstart", () => {}, { passive: true });

let waveformTheme = null;
let waveformSize = "";

function readWaveformTheme() {
  const style = getComputedStyle(elements.waveform);
  return {
    played: style.getPropertyValue("--waveform-played").trim() || "#315bca",
    rest: style.getPropertyValue("--waveform-rest").trim() || "#8290a3",
    empty: style.getPropertyValue("--waveform-empty").trim() || "#aeb6c2",
  };
}

function drawWaveform() {
  const canvas = elements.waveform,
    bounds = canvas.getBoundingClientRect(),
    ratio = window.devicePixelRatio || 1;
  if (!bounds.width || !bounds.height) return;
  // While the controls are away during playback nothing shows, so nothing is drawn.
  if (document.body.classList.contains("controls-idle") && document.body.classList.contains("visual-playing")) return;
  const size = `${Math.round(bounds.width * ratio)}x${Math.round(bounds.height * ratio)}`;
  if (size !== waveformSize) {
    waveformSize = size;
    canvas.width = Math.round(bounds.width * ratio);
    canvas.height = Math.round(bounds.height * ratio);
  }
  waveformTheme ||= readWaveformTheme();
  const context = canvas.getContext("2d");
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  const progress = Number(elements.seek.value) / 1000,
    peaks = selected?.peaks || [],
    barCount = Math.max(1, Math.floor(bounds.width / 5)),
    center = bounds.height / 2;
  context.clearRect(0, 0, bounds.width, bounds.height);
  if (!peaks.length) {
    context.fillStyle = waveformTheme.empty;
    context.fillRect(0, center, bounds.width, 1);
    return;
  }
  for (let index = 0; index < barCount; index++) {
    const start = Math.floor((index * peaks.length) / barCount),
      finish = Math.max(
        start + 1,
        Math.floor(((index + 1) * peaks.length) / barCount),
      );
    let height = 0;
    for (let sample = start; sample < finish; sample++)
      height = Math.max(height, peaks[sample] || 0);
    height = Math.max(3, height * (bounds.height - 22));
    context.fillStyle = index / barCount < progress ? waveformTheme.played : waveformTheme.rest;
    context.beginPath();
    context.roundRect(
      (index * bounds.width) / barCount,
      center - height / 2,
      Math.max(2, bounds.width / barCount - 2),
      height,
      1,
    );
    context.fill();
  }
}

function updatePosition() {
  const duration = Number.isFinite(audio.duration)
    ? audio.duration
    : selected?.duration || 0;
  const position = seekPreview?.position ?? playbackPosition();
  elements.position.textContent = time(position);
  elements.duration.textContent = time(duration);
  elements.seek.value = duration ? (position / duration) * 1000 : 0;
  elements.seek.setAttribute(
    "aria-valuetext",
    `${time(position)} of ${time(duration)}`,
  );
  elements.cursor.style.left = `${Number(elements.seek.value) / 10}%`;
  elements["mini-position"].textContent = elements.position.textContent;
  elements["mini-duration"].textContent = elements.duration.textContent;
  elements["mini-seek"].value = elements.seek.value;
  elements["mini-seek"].setAttribute("aria-valuetext", elements.seek.getAttribute("aria-valuetext"));
  elements["mini-seek"].style.setProperty("--progress", `${Number(elements.seek.value) / 10}%`);
  drawWaveform();
  updateTrackControls();
}

elements.seek.addEventListener("pointermove", (event) => {
  const bounds = elements.seek.getBoundingClientRect(),
    fraction = Math.max(
      0,
      Math.min(1, (event.clientX - bounds.left) / bounds.width),
    ),
    duration = Number.isFinite(audio.duration)
      ? audio.duration
      : selected?.duration || 0;
  elements["preview-needle"].style.left = `${fraction * 100}%`;
  elements["preview-time"].textContent = time(fraction * duration);
  elements["preview-time"].style.transform =
    fraction < 0.04
      ? "translateX(0)"
      : fraction > 0.96
        ? "translateX(-100%)"
        : "translateX(-50%)";
});

// The song as the visualizers read it: a track's performance.json decoded once into typed
// arrays, event lists and queries. Every query is a pure function of song time, so a seek,
// a pause or a headless render at any time gives the same picture as playing straight
// through. Nothing here touches the page.

const songSeriesRate = 100;

function decodeSongSeries(entry) {
  const text = atob(entry.data);
  const values = new Float32Array(text.length);
  const scale = (entry.upper - entry.lower) / 255;
  for (let index = 0; index < text.length; index++) values[index] = entry.lower + text.charCodeAt(index) * scale;
  return values;
}

// Index of the last value <= time in a sorted array, or -1.
function lastIndexAtOrBefore(values, time, length = values.length) {
  let low = 0,
    high = length - 1,
    found = -1;
  while (low <= high) {
    const middle = (low + high) >> 1;
    if (values[middle] <= time) {
      found = middle;
      low = middle + 1;
    } else high = middle - 1;
  }
  return found;
}

class SongEvents {
  // pairs: [[time, strength], ...] sorted by time
  constructor(pairs) {
    this.length = pairs.length;
    this.time = new Float64Array(pairs.length);
    this.strength = new Float32Array(pairs.length);
    pairs.forEach(([time, strength], index) => {
      this.time[index] = time;
      this.strength[index] = strength;
    });
  }
  last(time) {
    return lastIndexAtOrBefore(this.time, time, this.length);
  }
  // Seconds since the last event at or before `time` (Infinity when none).
  since(time) {
    const index = this.last(time);
    return index < 0 ? Infinity : time - this.time[index];
  }
  // Seconds until the first event after `time` (Infinity when none).
  until(time) {
    const index = this.last(time) + 1;
    return index >= this.length ? Infinity : this.time[index] - time;
  }
  // Strongest impulse at `time` from events in the last `window` seconds: strength * decay.
  impulse(time, decay, minimumStrength = 0) {
    let index = this.last(time),
      value = 0;
    while (index >= 0) {
      const age = time - this.time[index];
      if (age > decay * 6) break;
      if (this.strength[index] >= minimumStrength) value = Math.max(value, this.strength[index] * Math.exp(-age / decay));
      index--;
    }
    return value;
  }
}

class SongNotes {
  // rows: [[start, end, pitch, strength], ...] sorted by start
  constructor(rows) {
    this.length = rows.length;
    this.start = new Float64Array(rows.length);
    this.end = new Float64Array(rows.length);
    this.pitch = new Float32Array(rows.length);
    this.strength = new Float32Array(rows.length);
    rows.forEach(([start, end, pitch, strength], index) => {
      this.start[index] = start;
      this.end[index] = end;
      this.pitch[index] = pitch;
      this.strength[index] = strength;
    });
  }
  last(time) {
    return lastIndexAtOrBefore(this.start, time, this.length);
  }
  // The note sounding at `time`, or -1.
  active(time) {
    const index = this.last(time);
    return index >= 0 && time < this.end[index] ? index : -1;
  }
}

class SongModel {
  constructor(track, performance) {
    const visual = performance.visual || {};
    const offset = visual.grid_offset || 0;
    this.identifier = track.identifier;
    this.title = track.title;
    this.duration = performance.duration || track.duration;
    this.tempo = performance.tempo || 120;
    this.series = {};
    for (const [name, entry] of Object.entries(performance.series || {})) this.series[name] = decodeSongSeries(entry);
    this.frames = this.series.mix?.length || Math.ceil(this.duration * songSeriesRate) + 1;
    this.prefix = {};
    this.beats = Float64Array.from(visual.beats || performance.beats || []);
    this.downbeats = Float64Array.from(visual.downbeats || performance.downbeats || []);
    this.beatPeriod = this.beats.length > 1 ? (this.beats[this.beats.length - 1] - this.beats[0]) / (this.beats.length - 1) : 60 / this.tempo;
    this.barPeriod = this.beatPeriod * 4;
    const kicks = visual.kick || (performance.kicks || []).map((kick) => [kick.time, kick.strength]);
    this.kicks = new SongEvents(kicks);
    this.snares = new SongEvents(visual.snare || (performance.claps || []).map((clap) => [clap.time, clap.strength]));
    this.hats = new SongEvents(visual.hat || []);
    this.stabs = new SongEvents(visual.stab || []);
    this.bassNotes = new SongNotes(visual.bass_notes || []);
    this.vocalNotes = new SongNotes(visual.vocal_notes || []);
    this.chords = (visual.chords || []).map(([start, end, root, minor, confidence]) => ({ start, end, root, minor, confidence }));
    this.chordStarts = Float64Array.from(this.chords.map((chord) => chord.start));
    const sections = performance.sections || {};
    this.drops = (visual.drops || (sections.drops || []).map((drop) => ({ time: drop.time, gap_start: drop.gap_start, strength: drop.strength })))
      .map((drop) => ({ time: drop.time, gapStart: drop.gap_start, strength: drop.strength }));
    this.builds = (sections.builds || []).map((build) => {
      const drop = this.drops.find((entry) => Math.abs(entry.gapStart - (build.end + offset)) < 0.3 || Math.abs(entry.time - (build.end + offset)) < 0.3);
      return { start: build.start + offset, end: drop ? drop.gapStart : build.end + offset };
    });
    // A drop the analysis found no build for still gets an approach: the four bars before its
    // gap (or before it, when it has none) gather, so nothing lands unannounced. Ophelia's
    // main drop, American Boy's drop and NBLY's second drop are approaches.
    for (const drop of this.drops) {
      drop.build = this.builds.find((entry) => entry.end >= drop.gapStart - 0.3 && entry.end <= drop.time + 0.1) || null;
      if (!drop.build) drop.build = { start: drop.gapStart - 4 * this.barPeriod, end: drop.gapStart, approach: true };
    }
    this.breakdowns = (sections.breakdowns || []).map((part) => ({ start: part.start + offset, end: part.end + offset }));
    const anchor = visual.anchor || performance.anchor || { kind: "none", moments: [] };
    this.anchor = { kind: anchor.kind, word: anchor.word, moments: anchor.moments.map((moment) => ({ start: moment.start, end: moment.end })) };
    // A key-word anchor takes its moments from the revised lyrics when they found the word
    // (Desire's "desire" is sung twelve times, not the eleven the first transcription heard).
    if (this.anchor.kind === "word") {
      const keyed = (visual.lyrics || []).filter((word) => word.key);
      if (keyed.length >= this.anchor.moments.length - 1)
        this.anchor.moments = keyed.map((word) => ({ start: word.start, end: Math.max(word.end, word.start + 0.25) }));
    }
    this.anchorStarts = Float64Array.from(this.anchor.moments.map((moment) => moment.start));
    // The main drop: the strongest, and of equals the later (the song's last word on it).
    this.mainDrop = -1;
    this.drops.forEach((drop, index) => {
      if (this.mainDrop < 0 || drop.strength >= this.drops[this.mainDrop].strength - 0.02) this.mainDrop = index;
    });
    this.peaks = (visual.peaks || []).map((peak) => ({ start: peak.start, end: peak.end, kind: peak.kind }));
    this.scenes = this.buildScenes(visual.scenes || []);
    // The song's turn: where its late look begins. The main drop, unless that comes early
    // (American Boy's only drop is at 19 %); then the first full section after 60 % of the
    // song, so the late look is the last third, not four fifths.
    const mainTime = this.mainDrop >= 0 ? this.drops[this.mainDrop].time : Infinity;
    this.lateStart = mainTime;
    if (mainTime < this.duration * 0.45) {
      const late = this.scenes.find((scene) => scene.start >= this.duration * 0.6 && (scene.kind === "drive" || scene.kind === "drop" || scene.kind === "groove"));
      if (late) this.lateStart = late.start;
    }
    this.sceneStarts = Float64Array.from(this.scenes.map((scene) => scene.start));
    this.lyrics = this.buildLyrics(visual.lyrics || []);
    this.dropState = { phase: 0, index: -1, progress: 0, since: Infinity, until: Infinity, drop: null, build: null };
  }

  buildScenes(rows) {
    if (!rows.length) rows = [{ start: 0, end: this.duration, kind: "drive", energy: 0.8, vocals: 0 }];
    const counts = {};
    const energies = rows.map((row) => row.energy);
    const low = Math.min(...energies),
      high = Math.max(...energies);
    return rows.map((row, index) => {
      counts[row.kind] = (counts[row.kind] || 0) + 1;
      return {
        start: row.start,
        end: row.end,
        kind: row.kind,
        energy: row.energy,
        intensity: high > low ? (row.energy - low) / (high - low) : 1,
        vocals: row.vocals,
        index,
        kindIndex: counts[row.kind] - 1,
      };
    });
  }

  buildLyrics(rows) {
    const words = rows.map((row, index) => ({
      text: row.text,
      start: row.start,
      end: row.end,
      probability: row.probability,
      votes: row.votes || 0,
      line: row.line,
      key: Boolean(row.key),
      index,
    }));
    const lines = [];
    for (const word of words) {
      if (!lines.length || lines[lines.length - 1].number !== word.line)
        lines.push({ number: word.line, words: [], start: word.start, end: word.end });
      const line = lines[lines.length - 1];
      line.words.push(word);
      line.end = word.end;
    }
    return { words, lines, wordStarts: Float64Array.from(words.map((word) => word.start)), lineStarts: Float64Array.from(lines.map((line) => line.start)) };
  }

  // ---- continuous series (100 per second) ----

  value(name, time) {
    const values = this.series[name];
    if (!values) return 0;
    const position = time * songSeriesRate;
    const index = Math.floor(position);
    if (index < 0) return values[0];
    if (index >= values.length - 1) return values[values.length - 1];
    const fraction = position - index;
    return values[index] * (1 - fraction) + values[index + 1] * fraction;
  }

  // Mean of a series over [start, end], from prefix sums built on first use.
  mean(name, start, end) {
    const values = this.series[name];
    if (!values) return 0;
    let prefix = this.prefix[name];
    if (!prefix) {
      prefix = this.prefix[name] = new Float64Array(values.length + 1);
      for (let index = 0; index < values.length; index++) prefix[index + 1] = prefix[index] + values[index];
    }
    const first = Math.max(0, Math.min(values.length, Math.floor(start * songSeriesRate)));
    const last = Math.max(first + 1, Math.min(values.length, Math.ceil(end * songSeriesRate)));
    return (prefix[last] - prefix[Math.min(first, last - 1)]) / Math.max(1, last - first);
  }

  chroma(time, into) {
    for (let index = 0; index < 12; index++) into[index] = this.value(`pitch_class_${index}`, time);
    return into;
  }

  // ---- grid ----

  beatIndex(time) {
    const index = lastIndexAtOrBefore(this.beats, time);
    if (index >= 0) return index;
    return Math.floor((time - (this.beats[0] || 0)) / this.beatPeriod);
  }

  beatTime(index) {
    const count = this.beats.length;
    if (!count) return index * this.beatPeriod;
    if (index < 0) return this.beats[0] + index * this.beatPeriod;
    if (index >= count) return this.beats[count - 1] + (index - count + 1) * this.beatPeriod;
    return this.beats[index];
  }

  // Beats since the first beat, fractional: 12.25 is a quarter past beat 12.
  beatPosition(time) {
    const index = this.beatIndex(time);
    const start = this.beatTime(index),
      end = this.beatTime(index + 1);
    return index + (time - start) / Math.max(1e-6, end - start);
  }

  barIndex(time) {
    const index = lastIndexAtOrBefore(this.downbeats, time);
    if (index >= 0) return index;
    return Math.floor((time - (this.downbeats[0] || 0)) / this.barPeriod);
  }

  barTime(index) {
    const count = this.downbeats.length;
    if (!count) return index * this.barPeriod;
    if (index < 0) return this.downbeats[0] + index * this.barPeriod;
    if (index >= count) return this.downbeats[count - 1] + (index - count + 1) * this.barPeriod;
    return this.downbeats[index];
  }

  barPosition(time) {
    const index = this.barIndex(time);
    const start = this.barTime(index),
      end = this.barTime(index + 1);
    return index + (time - start) / Math.max(1e-6, end - start);
  }

  // ---- structure ----

  sceneIndex(time) {
    return Math.max(0, lastIndexAtOrBefore(this.sceneStarts, time));
  }

  scene(time) {
    return this.scenes[this.sceneIndex(time)];
  }

  chordIndex(time) {
    return lastIndexAtOrBefore(this.chordStarts, time);
  }

  // Where `time` sits against the drops: phase 0 = nothing near, 1 = in a build (progress
  // 0..1), 2 = in the gap (progress 0..1), 3 = after a drop (since = seconds since it).
  // Always reuses one object.
  dropContext(time) {
    const state = this.dropState;
    state.phase = 0;
    state.index = -1;
    state.progress = 0;
    state.drop = null;
    state.build = null;
    state.since = Infinity;
    state.until = Infinity;
    for (let index = 0; index < this.drops.length; index++) {
      const drop = this.drops[index];
      if (time >= drop.time) {
        state.since = time - drop.time;
        state.index = index;
        state.drop = drop;
        state.phase = 3;
        continue;
      }
      state.until = drop.time - time;
      if (time >= drop.gapStart && drop.gapStart < drop.time) {
        state.phase = 2;
        state.index = index;
        state.drop = drop;
        state.progress = (time - drop.gapStart) / (drop.time - drop.gapStart);
        return state;
      }
      const build = drop.build;
      if (build && time >= build.start) {
        state.phase = 1;
        state.index = index;
        state.drop = drop;
        state.build = build;
        state.progress = Math.min(1, (time - build.start) / Math.max(0.1, build.end - build.start));
        return state;
      }
      return state;
    }
    return state;
  }

  // Index of the anchor moment containing `time` (or -1), for the key word or lead-in. A
  // moment ends where the next thing (the drop, for a lead-in) begins, so the end is open.
  anchorAt(time) {
    const index = lastIndexAtOrBefore(this.anchorStarts, time);
    return index >= 0 && time < this.anchor.moments[index].end ? index : -1;
  }

  // The named peak containing `time` (chord passages, words), or null.
  peakAt(time) {
    for (const peak of this.peaks) if (time >= peak.start && time < peak.end) return peak;
    return null;
  }

  // ---- words ----

  wordIndex(time) {
    return lastIndexAtOrBefore(this.lyrics.wordStarts, time);
  }

  lineIndex(time) {
    return lastIndexAtOrBefore(this.lyrics.lineStarts, time);
  }
}

// Fetches and decodes a track's analysis once per track; later calls share the promise.
const songModelCache = new Map();

function loadSongModel(track) {
  if (!track?.performance_url) return Promise.resolve(null);
  if (!songModelCache.has(track.identifier)) {
    songModelCache.set(
      track.identifier,
      fetch(track.performance_url)
        .then((response) => {
          if (!response.ok) throw Error("Performance unavailable");
          return response.json();
        })
        .then((performance) => new SongModel(track, performance))
        .catch((error) => {
          songModelCache.delete(track.identifier);
          throw error;
        }),
    );
  }
  return songModelCache.get(track.identifier);
}

// The visualizer slot. The player calls five functions; this file keeps the frame loop,
// a song clock, the choice of visualizer (keys 1–4, remembered), and the playing chrome.
// Each visualizer (visual-*.js) registers itself with registerVisualizer() and draws a
// picture that is a function of song time and the song's analysis only.
//
//   prepareVisualizer(track, version)  a track was selected; `track.performance_url`
//                                      and `track.analysis_url` point at its data
//   visualizerSeekStarted()            a seek began; the time is about to jump
//   drawVisualizer(timestamp)          draw now (resize, seek, selection)
//   startVisualizer()                  audio started or resumed
//   stopVisualizer()                   audio paused, ended or the page hid
//
// A visualizer is { key, name, theme, create(stage) } where create returns
// { canvas, setSong(model), resize(width, height, ratio), render(time, frame), setActive(on) }.

let visualizerFrame = 0;
let visualizerTrack = null;
let visualizerSong = null;
let visualizerDebugTime = null;
const visualizerChoiceKey = "listening-room.visualizer.v1";
const visualizerDefault = "rig";
const visualizerDefinitions = [];
const visualizerInstances = new Map();
let visualizerActive = null;
let visualizerSize = { width: 0, height: 0, ratio: 1 };
const visualizerClock = { reported: -1, time: 0, now: 0 };
const visualizerFrameInfo = { time: 0, now: 0, playing: false, width: 0, height: 0, ratio: 1, song: null, titleBottom: 0, titleRight: 0 };
let visualizerTitleBottom = 0;
let visualizerTitleRight = 0;
let visualizerReadyResolve;
const visualizerReady = new Promise((resolve) => (visualizerReadyResolve = resolve));

function registerVisualizer(definition) {
  visualizerDefinitions.push(definition);
  visualizerDefinitions.sort((first, second) => first.order - second.order);
}

function readVisualizerChoice() {
  const requested = new URLSearchParams(location.search).get("visual");
  if (requested) return requested;
  try {
    return localStorage.getItem(visualizerChoiceKey) || visualizerDefault;
  } catch (error) {
    return visualizerDefault;
  }
}

function visualizerInstance(key) {
  const definition = visualizerDefinitions.find((entry) => entry.key === key) || visualizerDefinitions.find((entry) => entry.key === visualizerDefault);
  if (!definition) return null;
  if (!visualizerInstances.has(definition.key)) {
    const instance = definition.create(elements.visualizer);
    instance.definition = definition;
    instance.canvas.classList.add("visual-canvas");
    elements.visualizer.prepend(instance.canvas);
    if (visualizerSize.width) instance.resize(visualizerSize.width, visualizerSize.height, visualizerSize.ratio);
    instance.setSong(visualizerSong);
    visualizerInstances.set(definition.key, instance);
  }
  return visualizerInstances.get(definition.key);
}

// A visualizer may colour the page per song (themeFor returns CSS custom properties).
let visualizerThemeKeys = [];
function applyVisualizerTheme() {
  const root = document.documentElement;
  for (const key of visualizerThemeKeys) root.style.removeProperty(key);
  visualizerThemeKeys = [];
  const properties = visualizerActive?.themeFor?.(visualizerSong) || {};
  for (const [key, value] of Object.entries(properties)) {
    root.style.setProperty(key, value);
    visualizerThemeKeys.push(key);
  }
  waveformTheme = null;
}

function selectVisualizer(key, remember = true) {
  const instance = visualizerInstance(key);
  if (!instance) return;
  if (remember) {
    try {
      localStorage.setItem(visualizerChoiceKey, instance.definition.key);
    } catch (error) {}
  }
  if (instance === visualizerActive) return;
  visualizerActive?.setActive(false);
  visualizerActive = instance;
  instance.setActive(true);
  document.documentElement.dataset.visual = instance.definition.key;
  applyVisualizerTheme();
  measureVisualizer(); // each look sets the title in its own face and size
  drawVisualizer();
  drawWaveform();
}

function measureVisualizer() {
  const intro = document.querySelector("#player-view > .intro");
  const stageTop = elements.visualizer.getBoundingClientRect().top;
  visualizerTitleBottom = intro ? Math.max(0, intro.getBoundingClientRect().bottom - stageTop) : 0;
  // how far right the title and credits text reach (the block itself is full width)
  visualizerTitleRight = 0;
  if (intro) {
    const stageLeft = elements.visualizer.getBoundingClientRect().left;
    const range = document.createRange();
    for (const line of intro.querySelectorAll("h1, p")) {
      range.selectNodeContents(line);
      visualizerTitleRight = Math.max(visualizerTitleRight, range.getBoundingClientRect().right - stageLeft);
    }
  }
  const bounds = elements.visualizer.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  if (bounds.width === visualizerSize.width && bounds.height === visualizerSize.height && ratio === visualizerSize.ratio) return;
  visualizerSize = { width: bounds.width, height: bounds.height, ratio };
  for (const instance of visualizerInstances.values()) instance.resize(bounds.width, bounds.height, ratio);
}

// Song time for this frame. Between the element's own updates the clock runs on the frame
// timestamp, never more than a quarter second past the last reported position.
function visualizerSongTime(now) {
  if (visualizerDebugTime !== null) return visualizerDebugTime;
  const reported = playbackPosition();
  if (audio.paused || audio.ended || reported !== visualizerClock.reported) {
    visualizerClock.reported = reported;
    visualizerClock.time = reported;
    visualizerClock.now = now;
    return reported;
  }
  const elapsed = ((now - visualizerClock.now) / 1000) * (audio.playbackRate || 1);
  return visualizerClock.time + Math.min(Math.max(0, elapsed), 0.25);
}

function prepareVisualizer(track, version) {
  visualizerTrack = track;
  visualizerSize = { width: 0, height: 0, ratio: 1 };
  visualizerSong = null;
  for (const instance of visualizerInstances.values()) instance.setSong(null);
  applyVisualizerTheme();
  drawVisualizer();
  loadSongModel(track)
    .then((model) => {
      if (version !== selectionVersion || visualizerTrack !== track) return;
      visualizerSong = model;
      for (const instance of visualizerInstances.values()) instance.setSong(model);
      applyVisualizerTheme();
      drawVisualizer();
      drawWaveform();
      visualizerReadyResolve?.(true);
      // Warm every other track's analysis, one at a time, so switching songs never shows a
      // frame without its data.
      tracks.filter((entry) => !songModelCache.has(entry.identifier)).forEach((entry, index) =>
        setTimeout(() => loadSongModel(entry).catch(() => {}), 800 + index * 700));
    })
    .catch(() => visualizerReadyResolve?.(false));
}

function visualizerSeekStarted() {
  visualizerClock.reported = -1;
}

function drawVisualizer(timestamp = performance.now()) {
  if (!visualizerActive) return;
  if (!visualizerSize.width) measureVisualizer();
  if (!visualizerSize.width || !visualizerSize.height) return;
  const frame = visualizerFrameInfo;
  frame.now = timestamp;
  frame.time = visualizerSongTime(timestamp);
  frame.playing = visualizerDebugTime !== null ? document.body.classList.contains("visual-playing") : !audio.paused && !audio.ended;
  frame.width = visualizerSize.width;
  frame.height = visualizerSize.height;
  frame.ratio = visualizerSize.ratio;
  frame.song = visualizerSong;
  frame.titleBottom = visualizerTitleBottom;
  frame.titleRight = visualizerTitleRight;
  visualizerActive.render(frame.time, frame);
}

function visualizerFrameLoop(timestamp) {
  if (audio.paused || audio.ended || document.hidden) {
    stopVisualizer();
    return;
  }
  drawVisualizer(timestamp);
  updatePosition();
  visualizerFrame = requestAnimationFrame(visualizerFrameLoop);
}

function startVisualizer() {
  cancelAnimationFrame(visualizerFrame);
  const playing = !audio.paused && !audio.ended;
  document.body.classList.toggle("visual-playing", playing);
  if (playing && !document.body.classList.contains("visual-playing-started")) {
    document.body.classList.add("visual-playing-started", "controls-idle");
  }
  drawVisualizer();
  if (!audio.paused && !audio.ended && !document.hidden) visualizerFrame = requestAnimationFrame(visualizerFrameLoop);
}

function stopVisualizer() {
  cancelAnimationFrame(visualizerFrame);
  visualizerFrame = 0;
  if (audio.paused || audio.ended) {
    document.body.classList.remove("visual-playing", "visual-playing-started", "controls-idle");
    clearTimeout(controlsIdleTimer);
  }
  drawVisualizer();
  drawWaveform();
}

document.addEventListener("visibilitychange", () => (document.hidden || audio.paused ? stopVisualizer() : startVisualizer()));

// ---- playing chrome: the play button leaves while audio plays; the controls step aside
// until the pointer moves or focus enters them.

let controlsIdleTimer = 0;

function showControls() {
  if (!document.body.classList.contains("controls-idle")) {
    clearTimeout(controlsIdleTimer);
  } else {
    document.body.classList.remove("controls-idle");
    drawWaveform();
  }
  clearTimeout(controlsIdleTimer);
  if (document.body.classList.contains("visual-playing")) {
    controlsIdleTimer = setTimeout(() => {
      if (!document.body.classList.contains("visual-playing")) return;
      // Keyboard focus in the controls keeps them; a mouse click that left focus there does not.
      if (document.querySelector("#player-view .waveform :focus-visible, #player-view .transport :focus-visible, #player-view .download-row :focus-visible, .header :focus-visible"))
        return;
      document.body.classList.add("controls-idle");
    }, 2600);
  }
}

let lastPointer = null;
document.addEventListener("pointermove", (event) => {
  // Browsers send a pointermove when the page scrolls or re-lays out under a still pointer.
  if (lastPointer && Math.abs(event.clientX - lastPointer[0]) < 2 && Math.abs(event.clientY - lastPointer[1]) < 2) return;
  lastPointer = [event.clientX, event.clientY];
  showControls();
});
document.addEventListener("focusin", (event) => {
  if (event.target.closest?.("#player-view, .header") && event.target.matches?.(":focus-visible")) showControls();
});

// Clicking the picture pauses or resumes, since the play button is away while audio plays.

function typingInto(target) {

document.addEventListener("keydown", (event) => {

    event.preventDefault();

const clamp01 = (value) => (value < 0 ? 0 : value > 1 ? 1 : value);
const clampRange = (value, low, high) => (value < low ? low : value > high ? high : value);
const mixValue = (first, second, amount) => first + (second - first) * amount;
const smoothStep = (edge0, edge1, value) => {
  const x = clamp01((value - edge0) / (edge1 - edge0));
  return x * x * (3 - 2 * x);
};
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInCubic = (x) => Math.pow(clamp01(x), 3);
const easeInOutCubic = (x) => {
  x = clamp01(x);
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
};
const easeOutBack = (x, overshoot = 1.7) => {
  x = clamp01(x) - 1;
  return 1 + (overshoot + 1) * x * x * x + overshoot * x * x;
};
// A hit that lands instantly and decays: 1 at age 0, e^-1 at age = decay.
const hitDecay = (age, decay) => (age < 0 || !Number.isFinite(age) ? 0 : Math.exp(-age / decay));
const fract = (value) => value - Math.floor(value);
// Deterministic hash of an integer to 0..1.
const hash01 = (value) => {
  let x = Math.imul((value | 0) ^ 0x9e3779b9, 0x85ebca6b);
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
};

function hexColor(hex) {
  const value = parseInt(hex.replace("#", ""), 16);
  return [((value >> 16) & 255) / 255, ((value >> 8) & 255) / 255, (value & 255) / 255];
}

function cssColor([red, green, blue], alpha = 1) {
  return `rgba(${Math.round(red * 255)},${Math.round(green * 255)},${Math.round(blue * 255)},${alpha})`;
}

function mixColor(first, second, amount, into = [0, 0, 0]) {
  into[0] = first[0] + (second[0] - first[0]) * amount;
  into[1] = first[1] + (second[1] - first[1]) * amount;
  into[2] = first[2] + (second[2] - first[2]) * amount;
  return into;
}

function createVisualCanvas() {
  const canvas = document.createElement("canvas");
  canvas.hidden = true;
  canvas.setAttribute("aria-hidden", "true");
  return canvas;
}

function createWebGL(canvas) {
  return canvas.getContext("webgl2", {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: false,
    powerPreference: "high-performance",
  });
}

function compileWebGLProgram(gl, vertexSource, fragmentSource) {
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader) || "Shader failed");
    return shader;
  };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program) || "Link failed");
  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < count; index++) {
    const info = gl.getActiveUniform(program, index);
    const name = info.name.replace(/\[0\]$/, "");
    uniforms[name] = gl.getUniformLocation(program, info.name);
  }
  return { program, uniforms };
}

const fullscreenVertexShader = `#version 300 es
out vec2 vUv;
void main() {
  vec2 position = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = position;
  gl_Position = vec4(position * 2.0 - 1.0, 0.0, 1.0);
}`;

// Backing-store size for a canvas: device pixels, capped so a large or dense display cannot
// multiply the per-frame cost.
function canvasPixels(width, height, ratio, maximumPixels) {
  let scale = ratio;
  if (width * height * scale * scale > maximumPixels) scale = Math.sqrt(maximumPixels / (width * height));
  return [Math.max(1, Math.round(width * scale)), Math.max(1, Math.round(height * scale)), scale];
}

// Rig: a timecoded lighting show in a black room. Moving heads on a back truss pan with the
// bass line (every head together, low notes left, high right), a row of floor jets fires on
// every kick, a follow-spot from above follows the voice from mark to mark, strobe cells on
// the truss take the backbeat; in swung songs the heads chase sideways on the swung
// sixteenth. Each song has its own opening composition, its own drop (camera and looks) and
// a signature look that recurs through it. Builds converge the beams into a spike overhead
// and push the camera in; the gap before a drop is a blackout that counts in with blinders;
// the drop fires every fixture at the audience on its exact frame and holds the brightest
// state of the song for two beats, then a chase steps across the rig. The beams are single
// scattering in haze, integrated in closed form per pixel (no bloom, no post-process).

const rigHeadCount = 8;
const rigJetCount = 8;
const rigBeamCount = rigHeadCount + rigJetCount + 1;
// Fixture order: symmetric pairs spreading outward, so a partly lit rig stays balanced.
const rigHeadOrder = [3, 4, 1, 6, 2, 5, 0, 7];
// Each song opens on its own composition (its thumbnail), lands its drops in its own way
// and keeps a signature look that recurs through its drives.
// A drop's camera is never used by any other section of its song; breakdowns take their
// looks in the song's own order.
const rigSongs = {

  "1d589940ca458d793a3fad8a": { shot: "hero", look: "blade", drop: { shot: "floor", mainShot: "side", looks: ["cross", "fan"], funnel: true }, signature: "cross", breaks: ["vee"] }, // Desire
  f127a026dc751f1528bfb95d: { shot: "hero", look: "rain", drop: { shot: "side", looks: ["rain", "fan"] }, signature: "rain", breaks: ["curtain", "cathedral"] }, // Ophelia
  "8eee874c702a10807f79706c": { shot: "wide", look: "scissor", drop: { shot: "high", looks: ["scissor", "vee"] }, signature: "scissor", breaks: ["cathedral", "rain"] }, // Outside
  "4048d4a6dce44c151690b2b1": { shot: "right", look: "cross", drop: { shot: "low", looks: ["cross", "curtain"] }, signature: "curtain", breaks: ["rain", "vee"] }, // American Boy

const rigDefaultSong = { shot: "hero", look: "fan", drop: { shot: "floor", looks: ["fan", "vee"] }, signature: "fan", breaks: ["cathedral", "curtain", "rain", "vee"] };
const rigGels = {
  "5ff86d6cd02ebd7308e03df8": "#3f74ff", // NBLY: cold blue
  "1d589940ca458d793a3fad8a": "#ff2d2d", // Desire: red
  f127a026dc751f1528bfb95d: "#2fe0b5", // Ophelia: mint
  "8eee874c702a10807f79706c": "#ffb020", // Outside: amber
  "4048d4a6dce44c151690b2b1": "#ff3fb4", // American Boy: magenta
};

const rigFragmentShader = `#version 300 es
precision highp float;
precision highp sampler3D;
in vec2 vUv;
out vec4 outColor;
uniform vec2 uResolution;
uniform vec3 uCameraPosition;
uniform vec3 uCameraTarget;
uniform float uFov;
uniform vec4 uBeamApex[${rigBeamCount}];   // xyz apex, w cos(half angle)
uniform vec4 uBeamAxis[${rigBeamCount}];   // xyz axis, w intensity
uniform vec4 uBeamColor[${rigBeamCount}];  // rgb, w length
uniform vec4 uHaze;        // x density, y texture amount, z drift time, w floor gloss
uniform vec4 uFlash;       // rgb, w amount
uniform vec4 uStrobe;      // x snare flash, y hat sparkle, z seed, w truss light
uniform vec4 uWash;        // rgb back wall wash, w amount
uniform float uLens;
uniform float uLensSize;
uniform float uSeed;
uniform sampler3D uNoise;

const float INF = 1e6;

// The part of the ray inside the forward nappe of a cone, clipped to [0, far] and to the
// beam's length. A cone narrower than 90 degrees is convex, so this is one interval.
bool coneSpan(vec3 origin, vec3 direction, vec3 apex, vec3 axis, float cosAngle, float len, float far, out float t0, out float t1) {
  vec3 offset = origin - apex;
  float dv = dot(direction, axis);
  float cv = dot(offset, axis);
  float c2 = cosAngle * cosAngle;
  float a = dv * dv - c2;
  float h = dv * cv - dot(direction, offset) * c2;
  float c = cv * cv - dot(offset, offset) * c2;
  if (abs(a) < 1e-6) a = a < 0.0 ? -1e-6 : 1e-6;
  float disc = h * h - a * c;
  if (disc < 0.0) {
    if (a < 0.0) return false;
    t0 = -INF; t1 = INF;
  } else {
    float root = sqrt(disc);
    float r1 = (-h - root) / a, r2 = (-h + root) / a;
    if (r1 > r2) { float s = r1; r1 = r2; r2 = s; }
    if (a < 0.0) { t0 = r1; t1 = r2; }
    else if (cv + (r1 - 1.0) * dv >= 0.0) { t0 = -INF; t1 = r1; }
    else { t0 = r2; t1 = INF; }
  }
  // forward nappe and length: 0 <= cv + t dv <= len
  if (abs(dv) > 1e-6) {
    float tStart = (0.0 - cv) / dv, tEnd = (len - cv) / dv;
    if (dv > 0.0) { t0 = max(t0, tStart); t1 = min(t1, tEnd); }
    else { t0 = max(t0, tEnd); t1 = min(t1, tStart); }
  } else if (cv < 0.0 || cv > len) return false;
  t0 = max(t0, 0.0);
  t1 = min(t1, far);
  return t1 > t0;
}

// Light scattered toward the eye by one beam along [t0, t1]: the 1/d^2 integral in closed
// form, times the beam's angular profile at the chord's closest approach to the axis.
vec3 beamScatter(vec3 origin, vec3 direction, int index, float far, bool textured) {
  vec4 apexData = uBeamApex[index];
  vec4 axisData = uBeamAxis[index];
  if (axisData.w <= 0.0005) return vec3(0.0);
  float t0, t1;
  vec3 apex = apexData.xyz, axis = axisData.xyz;
  float cosAngle = apexData.w;
  if (!coneSpan(origin, direction, apex, axis, cosAngle, uBeamColor[index].w, far, t0, t1)) return vec3(0.0);
  vec3 offset = origin - apex;
  float b = dot(direction, offset);
  float q2 = max(dot(offset, offset) - b * b, 1e-4);
  float q = sqrt(q2);
  float integral = (atan((t1 + b) / q) - atan((t0 + b) / q)) / q;
  // closest approach of the chord to the axis line gives the brightest point of the profile
  vec3 w0 = offset;
  float dd = dot(direction, axis);
  float denom = 1.0 - dd * dd;
  float tc = denom > 1e-5 ? (dd * dot(w0, axis) - dot(w0, direction)) / denom : 0.5 * (t0 + t1);
  tc = clamp(tc, t0, t1);
  vec3 point = origin + direction * tc - apex;
  float along = dot(point, axis);
  float cosTheta = along / max(length(point), 1e-4);
  float edge = clamp((cosTheta - cosAngle) / (1.0 - cosAngle), 0.0, 1.0);
  float profile = smoothstep(0.0, 0.22, edge) * (0.55 + 0.45 * edge * edge);
  float density = 1.0;
  if (textured) {
    vec3 middle = origin + direction * (0.5 * (t0 + t1));
    float n = texture(uNoise, middle * vec3(0.045, 0.07, 0.045) + vec3(uHaze.z * 0.013, uHaze.z * 0.006, 0.0)).r;
    float n2 = texture(uNoise, middle * vec3(0.13, 0.2, 0.13) - vec3(0.0, uHaze.z * 0.02, uHaze.z * 0.01)).r;
    density = mix(1.0, 0.35 + 1.3 * n * (0.6 + 0.8 * n2), uHaze.y);
  }
  return uBeamColor[index].rgb * (axisData.w * integral * profile * density * uHaze.x);
}

// A lens seen from the front: a hard disc, brightest when the fixture points at the eye.
// Small angles only, so the angle is taken from the cosine without acos.
vec3 lensGlow(vec3 origin, vec3 direction, int index) {
  vec4 axisData = uBeamAxis[index];
  vec3 toLens = uBeamApex[index].xyz - origin;
  float distanceToLens = length(toLens);
  vec3 toLensUnit = toLens / distanceToLens;
  float facing = max(0.0, -dot(toLensUnit, axisData.xyz));
  float size = 0.34 * uLensSize / distanceToLens;
  float angle = sqrt(max(0.0, 2.0 - 2.0 * dot(direction, toLensUnit)));
  if (angle > size * 12.0) return vec3(0.0);
  float disc = 1.0 - smoothstep(size * 0.8, size, angle);
  // the halo reaches zero at the cutoff, so it never ends on a hard circle
  float halo = exp(-angle / (size * 2.5)) * 0.25 * (1.0 - smoothstep(size * 4.0, size * 12.0, angle));
  float power = axisData.w * (0.08 + 2.0 * pow(facing, 12.0));
  return uBeamColor[index].rgb * (disc + halo) * power * uLens;
}

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
